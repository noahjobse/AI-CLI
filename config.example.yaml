version: 1
model: "gpt-4o-mini"
dataDir: "~/ai-sessions"
timeoutMinutes: 30
warnBeforeTimeoutSeconds: 120
responseSpeed: "fast"
defaultSearchProvider: "tavily"
maxAttachBytes: 204800
importContextTokens: 4000
modelAliases:
  gpt5: "gpt-5-mini"
  gpt4: "gpt-4o"
  gpt4mini: "gpt-4o-mini"
  gpt4turbo: "gpt-4-turbo"
costsPer1kTokens:
  gpt-5-mini:
    input: 0.0001
    output: 0.0003
  gpt-4o-mini:
    input: 0.00015
    output: 0.0006
  gpt-4o:
    input: 0.005
    output: 0.015
  gpt-4-turbo:
    input: 0.01
    output: 0.03
keyStorage:
  method: "keytar"
  local:
    encryptedKeyPath: "~/.aicli/key.enc"
    saltPath: "~/.aicli/key.salt"
    ivPath: "~/.aicli/key.iv"


